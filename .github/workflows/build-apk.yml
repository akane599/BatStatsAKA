name: Build installable APK

on:
  workflow_call:
    inputs:
      run_android_tests:
        description: Run Android 16 emulator tests
        type: boolean
        default: true
    secrets:
      PREVIEW_KEYSTORE_BASE64:
        required: false
      PREVIEW_STORE_PASSWORD:
        required: false
      PREVIEW_KEY_ALIAS:
        required: false
      PREVIEW_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: Run Android 16 emulator tests (recommended)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: phone-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PREVIEW_STORE_PASSWORD: ${{ secrets.PREVIEW_STORE_PASSWORD }}
      PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
      PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Configure optional stable preview signing
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$PREVIEW_KEYSTORE_BASE64" ]]; then
            test -n "$PREVIEW_STORE_PASSWORD" && test -n "$PREVIEW_KEY_ALIAS" && test -n "$PREVIEW_KEY_PASSWORD"
            install -d -m 700 "$RUNNER_TEMP/batstats-signing"
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batstats-signing/preview.keystore"
            chmod 600 "$RUNNER_TEMP/batstats-signing/preview.keystore"
            echo "PREVIEW_KEYSTORE_PATH=$RUNNER_TEMP/batstats-signing/preview.keystore" >> "$GITHUB_ENV"
            echo 'Preview uses the configured certificate. Compare signing fingerprints before updating.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$PREVIEW_STORE_PASSWORD$PREVIEW_KEY_ALIAS$PREVIEW_KEY_PASSWORD" ]]; then
            echo 'Incomplete preview signing configuration.' >&2
            exit 1
          else
            echo 'Preview uses this runner’s temporary development certificate. APKs from another run may not update it. Export history before uninstalling.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify and build
        run: |
          python3 scripts/check_migrations.py
          python3 scripts/check_history_queries.py
          python3 scripts/check_resources.py
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:testPreviewUnitTest :app:lintDebug :app:lintPreview :app:assembleDebug :app:assemblePreview :app:assembleDebugAndroidTest --no-daemon --no-configuration-cache --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3g
      - name: Enable KVM for the disposable emulator
        if: inputs.run_android_tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 device tests
        if: inputs.run_android_tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: bash scripts/check_android_device.sh
      - name: Record APK checksums and certificates
        run: |
          mkdir -p artifacts
          python3 scripts/collect_apks.py
          echo 'Download the installable-apks artifact below and extract the ZIP. BatStats Preview and BatStats Debug use separate packages from the original app.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RUN_DEVICE_CHECKS" != true ]]; then
            echo 'Android device tests were explicitly disabled for this run; only host checks and builds ran.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          RUN_DEVICE_CHECKS: ${{ inputs.run_android_tests }}
      - name: Upload installable APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installable-apks-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/batstats-signing/preview.keystore"
