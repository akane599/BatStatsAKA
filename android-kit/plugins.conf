droidforge@android-local                      android  https://github.com/SUDARSHANCHAUDHARI/DroidForge.git  61f85ff47566087e3afaf9bd09c2b2b5a6498fd0  # ~426  signing, versions, release
android-emulator-qa@android-local             android  https://github.com/ceabarr/claude-android-plugin.git  18e69487874cc57acd8b4a10de2d401c8e9f1fc5  # ~155  emulator QA (upstream name claude-android-qa-plugin is reserved since Claude Code 2.1.287)
claude-security@claude-plugins-official       android                                                                             # ~778 /claude-security
security-guidance@claude-plugins-official     android                                                                             # 0    risky-edit warnings
context7@claude-plugins-official              android                                                                             # 0    live library docs
