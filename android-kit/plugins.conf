# android-kit plugin list. setup.sh reads this; edit freely.
#
#   <plugin>@<marketplace>   <tier>   [git repo | local:<dir>]  [pinned sha]     # always-on tokens
#
# Every install is LOCAL scope: .claude/settings.local.json, private to you, never committed.
#   base     the toolshed foundation: orchestration, routing, models, rules, map, setup/health
#   android  the Android layer on top: LSP, skills/agents, device QA, security, docs
#   java     only when the project has .java sources
#   extra    only with --extras or --with <name>
#   retired  removed from projects by setup (replaced by the base)

# --- base: Eigenwise toolshed
sidequest@eigenwise-toolshed                  base          # ~848  board, category routing, worktree executors, verify-gated integration
model-gateway@eigenwise-toolshed              base          # ~131  GPT (ChatGPT/Codex subscription) routes for Sidequest; Claude traffic untouched. --no-gateway skips
live-rules@eigenwise-toolshed                 base          # ~134  injects .claude/live-rules/rules into every session and executor
codebase-mapper@eigenwise-toolshed            base          # ~138  project map in .claude/.codebase-info, loaded at start, refreshed on change
quartermaster@eigenwise-toolshed              base          # ~666  toolshed doctor, updates, resupply from your history

# --- android layer
kotlin-lsp-android@android-local              android  local:kotlin-lsp-android                                                   # 0    runs `kotlin-lsp` (setup installs it when missing), 5-min startup
